name: Deploy

on:
  push:
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Set lowercase image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
  
            APP_DIR="/srv/web/privat/obsidian-theme"
            REPO_URL="https://github.com/xSneaco/obsidian-theme-creator.git"
            BRANCH="master"
            
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            
            if [ -d .git ]; then
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
            elif [ -z "$(ls -A)" ]; then
            git clone --branch "$BRANCH" "$REPO_URL" .
            else
            echo "Non-empty directory without .git in $APP_DIR; cleaning and initializing repo"
            find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            git clone --branch "$BRANCH" "$REPO_URL" .
            fi
            
            ls -la
            [ -f docker-compose.yml ] || { echo "Missing docker-compose.yml"; exit 1; }
            [ -f docker-compose.prod.yml ] || { echo "Missing docker-compose.prod.yml"; exit 1; }
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u xSneaco --password-stdin
            export IMAGE_TAG=latest
            
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull frontend
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate frontend
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps